# ---------------------------------------------------------------------------
# Déploiement Render — offre SANS disque persistant
#
# Persistance des données : renseignez TURSO_DATABASE_URL + TURSO_AUTH_TOKEN
# (Turso / libSQL, offre gratuite) dans l'onglet Environment de Render.
#   -> Prix, réalisations, demandes de contact et statistiques survivent alors
#      aux redémarrages et redéploiements.
#
# Sans Turso, repli automatique sur SQLite dans /tmp, vidé à chaque redémarrage :
#   -> Les prix modifiés depuis le dashboard repartent des valeurs par défaut.
#   -> Les demandes de contact ne survivent pas non plus : la notification
#      e-mail / webhook est alors OBLIGATOIRE (sinon vous perdez les leads).
# ---------------------------------------------------------------------------
services:
  - type: web
    name: 4ur
    runtime: bun
    region: frankfurt
    plan: free
    healthCheckPath: /api/health
    buildCommand: bun install --no-frozen-lockfile && bun run build
    startCommand: HOSTNAME=0.0.0.0 PORT=$PORT bun .next/standalone/server.js
    envVars:
      # --- Techniques (valeurs connues) ---
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/tmp/4ur-db/custom.db
      - key: TRUST_PROXY
        value: "1"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://4ur.onrender.com # ⚠️ lire au build : à ajuster puis redéployer
      - key: PING_INTERVAL_MINUTES
        value: "5"
      - key: PING_NOTIFY_MODE
        value: "every_ping"

      # --- Secrets : à saisir dans le dashboard Render (jamais dans Git) ---
      - key: TURSO_DATABASE_URL
        sync: false # libsql://<base>-<org>.turso.io — active la persistance
      - key: TURSO_AUTH_TOKEN
        sync: false # turso db tokens create <base>
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DEV_PANEL_PIN
        sync: false # alias compatible de DASHBOARD_PASSWORD
      - key: DEV_PANEL_SECRET
        sync: false # openssl rand -hex 32
      - key: DISCORD_WEBHOOK_URL
        sync: false # URL initiale du webhook Discord (modifiable aussi dans /dashboard)
      - key: CONTACT_NOTIFY_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false
      - key: CONTACT_WEBHOOK_URL
        sync: false # alternative sans Resend (Slack, Discord, Make, n8n…)

      # --- Mentions légales (lues au build) ---
      - key: NEXT_PUBLIC_SIREN
        sync: false
      - key: NEXT_PUBLIC_SIRET
        sync: false
      - key: NEXT_PUBLIC_LEGAL_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_CONTACT_EMAIL
        sync: false
      - key: NEXT_PUBLIC_HOST_NAME
        sync: false
      - key: NEXT_PUBLIC_HOST_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_LEGAL_FORM
        sync: false
      - key: NEXT_PUBLIC_DIRECTOR
        sync: false
      - key: NEXT_PUBLIC_PHONE
        sync: false
